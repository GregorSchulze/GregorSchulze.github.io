    <script>
      // Theme vor dem ersten Rendern setzen, damit nichts aufblitzt
      try {
        var saved = localStorage.getItem("darkMode");
        var dark =
          saved === "true" ||
          (saved !== "false" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
